<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272f"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#7d8794"/>
      <stop offset="0.45" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#6b7480"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#2b3038"/>
      <circle cx="7" cy="7" r="3.2" fill="#545c68"/>
    </pattern>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#3a404a" stroke-width="3"/>
  <!-- level bars -->
  <g>
    <rect x="72"  y="300" width="26" height="110" rx="5" fill="#2fbf6a"/>
    <rect x="110" y="250" width="26" height="160" rx="5" fill="#4ade80"/>
    <rect x="376" y="200" width="26" height="210" rx="5" fill="#ffd84d"/>
    <rect x="414" y="150" width="26" height="260" rx="5" fill="#ffb020"/>
  </g>
  <!-- microphone capsule -->
  <rect x="186" y="78" width="140" height="220" rx="70" fill="url(#mesh)"/>
  <rect x="186" y="78" width="140" height="220" rx="70" fill="none" stroke="url(#metal)" stroke-width="12"/>
  <rect x="180" y="182" width="152" height="18" rx="4" fill="url(#metal)"/>
  <!-- yoke + stand -->
  <path d="M158 220 v28 a98 98 0 0 0 196 0 v-28" fill="none" stroke="url(#metal)" stroke-width="16" stroke-linecap="round"/>
  <rect x="246" y="344" width="20" height="62" fill="url(#metal)"/>
  <rect x="190" y="400" width="132" height="20" rx="10" fill="url(#metal)"/>
</svg>
