# Standalone "Gritómetro Studio": same code built with GRIT_EDITION=studio (npm run build:studio)
appId: com.gritometro.studio
productName: Gritometro Studio
extraMetadata:
  name: gritometro-studio
  description: Gritómetro Studio - medición y comparación profesional de micrófonos.
directories:
  buildResources: build
  output: dist-studio
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: Gritometro-Studio-${version}-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: Gritometro-Studio-${version}-mac-${arch}.${ext}
  # No Apple certificate: ad-hoc signature, first launch with right-click → Open
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Gritómetro Studio needs the microphone to measure audio.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Gritometro Studio
portable:
  artifactName: Gritometro-Studio-${version}-portable.${ext}
